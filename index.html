html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Space Grotesk",system-ui,sans-serif}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.5px;margin-right:auto}
.logo b{color:var(--pr)}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--sf2);border-radius:10px;padding:8px 14px;transition:transform .1s,background .15s}

.pri{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:700}.pri:hover{background:var(--pr);filter:brightness(1.1)}
.dng{color:var(--er)}

h1,h2,h3{letter-spacing:-.4px;margin:.2em 0 .5em}h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stat{font-size:32px;font-weight:700;color:var(--pr)}.mu{color:var(--mu);font-size:14px}
.bar{height:12px;border-radius:99px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .6s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
textarea{min-height:70px;font-family:"JetBrains Mono",monospace;font-size:13px}
pre{background:var(--code);color:var(--codet);border-radius:10px;padding:12px 14px;overflow-x:auto;font:13.5px/1.6 "JetBrains Mono",monospace;margin:8px 0;max-width:100%}
pre.bad{border-left:5px solid var(--er)}pre.good{border-left:5px solid var(--ok)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);margin-right:4px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;font-family:"JetBrains Mono",monospace;font-size:14px}
.opt.sel{border-color:var(--pr);background:var(--sf2);box-shadow:inset 0 0 0 2px var(--pr)}
.fb{border-radius:12px;padding:14px;margin-top:14px;animation:pop .35s}
.fb.ok{background:var(--okb);border:1px solid var(--ok)}.fb.no{background:var(--erb);border:1px solid var(--er)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.ph{position:relative}.ph.lock{opacity:.55}
.node{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin:6px 0}
.done{color:var(--ok);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.wrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pr);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:20;animation:pop .4s;max-width:90%}
.hero{text-align:center;padding:30px 0}
.hero h1{font-size:clamp(30px,6vw,50px)}
.hero pre{display:inline-block;text-align:left}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 {id:"c1",lang:"java",topic:"t2",phase:1,type:"choice",title:"Tipo certo",prompt:"Qual declaração cria corretamente uma variável inteira em Java?",code:"",opts:["int idade = 25;","integer idade = 25;","idade := 25;","var int idade = 25"],ans:"1",wrong:"integer idade = 25;",fix:"int idade = 25;",explain:"Em Java o tipo primitivo inteiro se chama int. “integer” não existe como palavra reservada e “:=” não faz parte da sintaxe.",why:"int é o tipo primitivo de 32 bits para números inteiros, seguido do nome e do valor."},

 ],

/* ===== TRILHA JAVA (7 níveis) ===== */
const JPH={1:"Fundamentos",2:"Condicionais e decisões",3:"Repetições e vetores",4:"Métodos e POO",5:"Exceções, Strings e coleções",6:"Java intermediário e avançado",7:"Java profissional"};
const JT=[["j1","Estrutura, saída e comentários",0],["j2","Variáveis, tipos primitivos e String",0],["j3","Operadores, Scanner e conversão",0],["j4","Condicionais: if, else, switch",0],["j5","Repetições: for, while, do-while",0],["j6","Vetores e matrizes",0],["j7","Classes, objetos e encapsulamento",0],["j8","Herança, polimorfismo e interfaces",0],["j9","Tratamento de exceções",0],["j10","Strings e coleções (ArrayList, HashMap)",0],["j11","Lambdas e Streams",8],["j12","Arquivos e threads",8],["j13","Records e recursos modernos",16],["j14","JDBC, testes e Spring Boot",8]];
const JC=[
["jc1","j1",1,"fill","Ponto de entrada","Complete o método que inicia todo programa Java:",`public static void ___(String[] args) {\n  System.out.println("Olá!");\n}`,[],"main",`public static void inicio(String[] args)`,`public static void main(String[] args)`,"A JVM procura um método chamado main para iniciar o programa. Com outro nome, a execução falha.","main é o ponto de entrada: a JVM o chama ao executar a classe."],
["jc2","j2",1,"choice","Tipo de dado adequado","Qual tipo é mais adequado para guardar o preço R$ 19,90?","",["int","double","boolean","char"],"2",`int preco = 19.90; // não compila`,`double preco = 19.90;`,"int guarda apenas números inteiros; 19.90 tem parte decimal e o compilador rejeita.","double armazena números decimais."],
["jc3","j3",1,"choice","Média de duas notas","O que este código imprime?",`int n1 = 7, n2 = 8;\ndouble media = (n1 + n2) / 2;\nSystem.out.println(media);`,["7.5","7.0","8.0","Erro de compilação"],"2",`double media = (n1 + n2) / 2; // 7.0`,`double media = (n1 + n2) / 2.0; // 7.5`,"(n1 + n2) e 2 são inteiros: 15 / 2 vale 7 (divisão inteira) e só depois vira 7.0.","Com 2.0 a divisão é decimal: 15 / 2.0 = 7.5."],
["jc4","j4",2,"choice","Aprovado ou não","Complete a condição para aprovar alunos com nota 7 ou mais:",`if (nota ___ 7) {\n  System.out.println("Aprovado");\n}`,[">=","=>","=","equals"],"1",`if (nota > 7) // reprova quem tirou 7`,`if (nota >= 7)`,"Com > o aluno com nota exatamente 7 seria reprovado. = é atribuição e => não existe em Java.",">= é verdadeiro quando a nota é 7 ou maior."],
["jc5","j4",2,"choice","Comparação de Strings","Como comparar o conteúdo de duas Strings?",`String nome = sc.nextLine();\nif (nome ___ "Ana") { }`,[`nome == "Ana"`,`nome.equals("Ana")`,`nome = "Ana"`,`nome.compare("Ana")`],"2",`if (nome == "Ana")`,`if (nome.equals("Ana"))`,"== compara referências, não o conteúdo, e pode dar false mesmo com texto igual.","equals compara os caracteres das duas Strings."],
["jc6","j5",3,"choice","Tabuada do 2","O que este laço imprime?",`for (int i = 1; i <= 3; i++) {\n  System.out.print(2 * i + " ");\n}`,["2 4 6","2 4 6 8","1 2 3","0 2 4"],"1",`for (int i = 1; i < 3; i++) // imprime só 2 4`,`for (int i = 1; i <= 3; i++) // imprime 2 4 6`,"Com <= o laço roda para i = 1, 2 e 3. Trocar por < perderia a última volta.","2*1, 2*2 e 2*3 resultam em 2, 4 e 6."],
["jc7","j6",3,"choice","Erro de índice","O que acontece ao executar?",`int[] v = new int[5];\nv[5] = 10;`,["Grava 10 na última posição","ArrayIndexOutOfBoundsException","Erro de compilação","O vetor cresce"],"2",`v[5] = 10; // posição inexistente`,`v[v.length - 1] = 10; // última posição (índice 4)`,"Um vetor de tamanho 5 tem índices de 0 a 4. O índice 5 está fora dos limites.","length - 1 sempre aponta para o último índice válido."],
["jc8","j7",4,"choice","Encapsulamento","Qual alteração protege o atributo saldo contra acesso direto?",`class Conta {\n  public double saldo;\n}`,["private double saldo; com getSaldo()","static double saldo;","final double saldo;","protected void saldo;"],"1",`conta.saldo = -500; // qualquer classe altera`,`class Conta {\n  private double saldo;\n  public double getSaldo() { return saldo; }\n  public void depositar(double v) { if (v > 0) saldo += v; }\n}`,"Com public, qualquer classe pode deixar o saldo negativo, quebrando as regras do negócio.","private esconde o atributo e os métodos validam cada alteração."],
["jc9","j8",4,"choice","Sobrecarga ou sobrescrita","Qual é um exemplo de sobrescrita (override)?","",["Dois métodos somar com parâmetros diferentes na mesma classe","Gerente redefine calcularBonus() herdado de Funcionario","Um construtor sem parâmetros","Uma classe com atributo static"],"2",`void somar(int a, int b)\nvoid somar(double a, double b) // sobrecarga`,`class Gerente extends Funcionario {\n  @Override\n  double calcularBonus() { return 1000; }\n}`,"Mesmo nome com parâmetros diferentes na mesma classe é sobrecarga.","Sobrescrita redefine na subclasse um método herdado com a mesma assinatura."],
["jc10","j9",5,"choice","Conversão inválida","Qual é o problema neste código Java?",`int numero = Integer.parseInt("ABC");`,["Lança NumberFormatException","Retorna 0","Erro de compilação","Retorna null"],"1",`int numero = Integer.parseInt("ABC");`,`try {\n  int numero = Integer.parseInt("ABC");\n} catch (NumberFormatException erro) {\n  System.out.println("Digite um número inteiro válido.");\n}`,"Integer.parseInt() converte textos que representam inteiros. A String \"ABC\" não representa um número.","Troque \"ABC\" por \"123\": a conversão passa a funcionar e devolve 123. O catch evita que a entrada inválida derrube o programa."],
["jc11","j9",5,"choice","Divisão por zero","O que acontece ao executar este código?",`int a = 10, b = 0;\nSystem.out.println(a / b);`,["Imprime 0","Imprime Infinity","Lança ArithmeticException","Erro de compilação"],"3",`System.out.println(a / b); // ArithmeticException`,`try {\n  System.out.println(a / b);\n} catch (ArithmeticException e) {\n  System.out.println("Divisão por zero!");\n}`,"Divisão inteira por zero lança ArithmeticException em tempo de execução. O código compila, mas o programa é interrompido.","O try executa o código de risco e o catch captura a exceção, permitindo que o programa continue."],
["jc12","j10",5,"choice","Posição da lista","O que acontece ao executar?",`ArrayList<String> lista = new ArrayList<>();\nlista.add("Java");\nSystem.out.println(lista.get(1));`,["Imprime Java","IndexOutOfBoundsException","Imprime null","Erro de compilação"],"2",`lista.get(1) // só existe a posição 0`,`if (lista.size() > 1) System.out.println(lista.get(1));`,"A lista tem 1 elemento, então só o índice 0 é válido.","size() permite verificar o limite antes de chamar get()."],
["jc13","j11",6,"choice","Filtrando com Streams","O que este código imprime?",`List<Integer> n = List.of(3, 6, 9);\nn.stream().filter(x -> x > 5).forEach(System.out::println);`,["3 6 9","6 9","3","Nada"],"2",`.filter(x -> x < 5) // imprimiria só 3`,`.filter(x -> x > 5) // imprime 6 e 9`,"filter mantém somente os elementos para os quais a condição é verdadeira.","x > 5 é falso para 3 e verdadeiro para 6 e 9."],
["jc14","j12",6,"fill","Acesso simultâneo","Qual palavra-chave impede que duas threads executem este método ao mesmo tempo?",`___ void atualizar() { total++; }`,[],"synchronized",`void atualizar() { total++; } // condição de corrida`,`synchronized void atualizar() { total++; }`,"total++ não é atômico: duas threads podem ler o mesmo valor e uma atualização se perde.","synchronized permite que apenas uma thread por vez execute o método."],
["jc15","j13",7,"choice","Records (Java 16+)","Qual declaração cria um record com nome e nota?","",["record Aluno(String nome, double nota) { }","class record Aluno(nome, nota)","record Aluno { String nome; }","data Aluno(String nome, double nota)"],"1",`class record Aluno(nome, nota)`,`record Aluno(String nome, double nota) { }`,"O record exige os tipos dos componentes e a palavra record no lugar de class.","O compilador gera construtor, acessores nome() e nota(), equals, hashCode e toString."],
["jc16","j14",7,"choice","JDBC seguro","Qual consulta é segura contra SQL Injection?","",[`"SELECT * FROM aluno WHERE nome='" + nome + "'"`,`prepareStatement("... WHERE nome = ?") + setString(1, nome)`,`"SELECT * FROM aluno WHERE nome=" + nome`,"con.commit()"],"2",`"... WHERE nome='" + nome + "'" // nome = x' OR '1'='1`,`PreparedStatement ps = con.prepareStatement("SELECT * FROM aluno WHERE nome = ?");\nps.setString(1, nome);`,"Concatenar a entrada permite que o usuário altere o comando SQL.","O parâmetro ? é enviado como dado e nunca interpretado como comando."]

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PH={1:"Básico",2:"Intermediário",3:"Avançado",4:"Nível 4",5:"Nível 5",6:"Nível 6",7:"Nível 7"};
const phName=(lg,p)=>((DB.langs.find(x=>x.id===lg)||{}).ph||{})[p]||PH[p];

const norm=s=>String(s).replace(/\s+/g,"").toLowerCase();

function grade(ch,ans){if(ch.type==="choice")return String(ans)===String(Number(ch.ans)-1);return ch.ans.split("|").some(a=>norm(a)===norm(ans))}
function award(u,ch,ok,secs,tries){
 const rec=u.done[ch.id]||(u.done[ch.id]={ok:false,tries:0,errs:0,secs:0});
 rec.tries++;rec.secs=secs;let pts=0,msgs=[];
 DB.log.push({u:u.name,ch:ch.id,ok,secs,t:Date.now()});if(DB.log.length>800)DB.log.shift();
 if(!ok){rec.errs++;u.streak=0}
 else{
  u.streak++;u.best=Math.max(u.best,u.streak);
  if(!rec.ok){ // pontos só na primeira conclusão
   pts=Math.max(1,DB.cfg.pts[ch.phase]-DB.cfg.penalty*rec.errs);
   if(u.streak>=3)pts+=Math.min(30,DB.cfg.streakBonus*(u.streak-2));
   rec.ok=true;u.xp+=pts;
   if(rec.errs>0)medal(u,"retry",msgs);
  }
  medal(u,"first",msgs);
  if(u.streak>=5)medal(u,"s5",msgs);
  if(u.xp>=100)medal(u,"xp100",msgs);
  const s=phaseStats(u,ch.lang,ch.phase);if(s.n&&s.d===s.n)medal(u,"ph",msgs);
  const all=CH(ch.lang);if(all.every(x=>doneOk(u,x.id)))medal(u,"lang",msgs);
 }
 save();return{pts,msgs};
}
function medal(u,k,msgs){if(!u.medals.includes(k)){u.medals.push(k);msgs.push(MEDALS[k][0]+" Medalha: "+MEDALS[k][1])}}

function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}

 go:d=>nav(d.v),

 sel:d=>{P.sel=+d.i;render()},
 check:()=>{const ch=P.ch,ans=ch.type==="choice"?P.sel:($("fa").value.trim());if(ans===null||ans===""){return toast("Escolha ou digite uma resposta.")}
  P.txt=ans;const ok=grade(ch,ans),secs=Math.round((Date.now()-P.t0)/1000),r=award(me(),ch,ok,secs);P.res={ok,...r};beep(ok);render();if(r.msgs.length)toast(r.msgs[0])},
 retry:()=>{P.res=null;P.sel=null;P.txt="";P.t0=Date.now();render()},
 next:()=>{const l=CH(P.ch.lang).filter(c=>unlocked(me(),c.lang,c.phase)&&!doneOk(me(),c.id));if(l.length)A.play({id:l[0].id});else{toast("Trilha concluída! 🎉");nav("sLang",{id:P.ch.lang})}},
 togT:d=>{const t=DB.topics.find(x=>x.id===d.id);t.on=t.on===false;save()},
 verL:d=>{const l=DB.langs.find(x=>x.id===d.id),v=prompt("Versão usada no curso (ex.: 17). Conteúdos que exigem versão maior ficam ocultos. Use 0 para sem limite:",l.ver||0);if(v!==null){l.ver=Math.max(0,parseInt(v)||0);save();render()}},
 tog:d=>{const l=DB.langs.find(x=>x.id===d.id);l.on=!l.on;save()},
 addL:()=>{const n=$("nl").value.trim().slice(0,30);if(!n)return toast("Digite o nome.");DB.langs.push({id:nextId("l"),name:n,on:true});save();render()},
 renL:d=>{const l=DB.langs.find(x=>x.id===d.id),n=prompt("Novo nome:",l.name);if(n&&n.trim()){l.name=n.trim().slice(0,30);save();render()}},
 delL:d=>{if(!confirm("Excluir linguagem e seus conteúdos e desafios?"))return;DB.langs=DB.langs.filter(x=>x.id!==d.id);DB.topics=DB.topics.filter(x=>x.lang!==d.id);DB.chs=DB.chs.filter(x=>x.lang!==d.id);save();render()},
 addT:()=>{const n=$("tn").value.trim().slice(0,60);if(!n||!$("tl").value)return toast("Informe linguagem e conteúdo.");DB.topics.push({id:nextId("t"),lang:$("tl").value,name:n,ver:Math.max(0,parseInt($("tv").value)||0),on:true});save();render()},
 renT:d=>{const t=DB.topics.find(x=>x.id===d.id),n=prompt("Novo nome:",t.name);if(n&&n.trim()){t.name=n.trim().slice(0,60);save();render()}},
 delT:d=>{if(!confirm("Excluir conteúdo e desafios ligados a ele?"))return;DB.topics=DB.topics.filter(x=>x.id!==d.id);DB.chs=DB.chs.filter(x=>x.topic!==d.id);save();render()},
 flang:()=>{ctx.edit={...(ctx.edit||{}),...readC(),lang:$("f_lang").value,topic:""};render()},
 edC:d=>nav("aChs",{edit:{...DB.chs.find(c=>c.id===d.id)}}),
 delC:d=>{if(confirm("Excluir este desafio?")){DB.chs=DB.chs.filter(c=>c.id!==d.id);save();render()}},
 saveC:d=>{const c=readC();c.id=d.id||nextId("c");
  if(!c.title||!c.prompt||!c.lang||!c.topic||!c.ans)return toast("Preencha linguagem, conteúdo, título, enunciado e resposta.");
  if(c.type==="choice"){if(c.opts.length<2)return toast("Informe ao menos 2 alternativas.");const n=Number(c.ans);if(!(n>=1&&n<=c.opts.length))return toast("A resposta deve ser o nº de uma alternativa.")}
  if(!c.explain||!c.why)return toast("Inclua as explicações pedagógicas.");
  const i=DB.chs.findIndex(x=>x.id===c.id);if(i>=0)DB.chs[i]=c;else DB.chs.push(c);save();toast("Desafio salvo.");nav("aChs")},
 saveCfg:()=>{const n=(id,max)=>Math.max(0,Math.min(max,parseInt($(id).value)||0));
  DB.cfg={pts:Object.fromEntries([1,2,3,4,5,6,7].map(p=>[p,n("c_p"+p,500)])),streakBonus:n("c_sb",50),penalty:n("c_pe",50),unlockPct:n("c_un",100),sound:$("c_so").checked,daily:$("c_da").checked};
  if($("c_pw").value){if($("c_pw").value.length<6)return toast("Senha com ao menos 6 caracteres.");DB.admin=hash($("c_pw").value)}save();toast("Configurações salvas.");render()},
 reset:()=>{if(confirm("Apagar TODOS os dados, inclusive alunos?")){DB=seed();migrate();render()}}
};
function readC(){const g=id=>($(id)?$(id).value:"");return{lang:g("f_lang"),topic:g("f_topic"),phase:+g("f_phase")||1,type:g("f_type"),title:g("f_title").trim(),prompt:g("f_prompt").trim(),code:g("f_code"),opts:g("f_opts").split("\n").map(s=>s.trim()).filter(Boolean),ans:g("f_ans").trim(),wrong:g("f_wrong"),fix:g("f_fix"),explain:g("f_explain").trim(),why:g("f_why").trim()}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName==="SELECT"||(t.type==="checkbox"&&e.type==="click"&&!/^tog/.test(t.dataset.a)))return;if(t.dataset.a==="flang")return;A[t.dataset.a]&&A[t.dataset.a](t.dataset)});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset&&t.dataset.a==="flang")A.flang()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="fa"&&!P.res)A.check();if(e.key==="Enter"&&(e.target.id==="up"||e.target.id==="un"))A.login()});
render();
</script>
</body>
</html>
